name: Code analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build with analyzers
        run: dotnet build .\SyncAnkiWithGooglePhraseBook.slnx --configuration Release
      - name: Run tests
        run: dotnet test .\SyncAnkiWithGooglePhraseBook.slnx --configuration Release --no-build
      - name: Install PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: .\scripts\Test-CodeAnalysis.ps1
